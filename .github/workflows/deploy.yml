name: Deploy the analytics demo to Pages

# The full ZUMIQ platform is a Next.js app deployed to Vercel. GitHub Pages
# serves static files only, so it publishes the dependency-free analytics
# demo from public/web rather than the repository root.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
